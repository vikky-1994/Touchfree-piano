<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eye Piano</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--fg:#1d1b18;--white:#fffdf8;--black:#25221e;--accent:#e0663a;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--fg:#f1ede4;--white:#e9e4d8;--black:#0c0b09;--card:#221f1a}}
:root[data-theme="dark"]{--bg:#15130f;--fg:#f1ede4;--white:#e9e4d8;--black:#0c0b09;--card:#221f1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 16px 6px;text-align:center}
h1{margin:0;font-size:1.3rem}
p.sub{margin:4px 0 0;font-size:.85rem;opacity:.7}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px}
button{font:inherit;padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600}
button.alt{background:var(--card);color:var(--fg);border:1px solid #8884}
#status{text-align:center;font-size:.8rem;min-height:1.2em;opacity:.8;padding:0 12px}
#piano{position:relative;flex:1;display:flex;margin:10px;gap:3px;min-height:0}
.key{flex:1;position:relative;border-radius:0 0 12px 12px;background:var(--white);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font-weight:700;font-size:.8rem;color:#0007;
--p:0;background-image:linear-gradient(to top,var(--accent) calc(var(--p)*100%),transparent 0);transition:transform .08s}
.key.on{transform:translateY(4px);filter:brightness(1.15)}
.black{position:absolute;top:0;height:60%;width:7%;margin-left:-3.5%;background:var(--black);z-index:2;border-radius:0 0 8px 8px;color:#fff8;
--p:0;background-image:linear-gradient(to top,var(--accent) calc(var(--p)*100%),transparent 0);padding-bottom:8px}
#dot{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid var(--accent);background:#e0663a44;pointer-events:none;z-index:50;display:none}
#cal{position:fixed;inset:0;background:#000a;z-index:40;display:none}
#cal button.pt{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;padding:0;background:#e0663a;opacity:1}
#cal .msg{position:absolute;top:30%;left:0;right:0;text-align:center;color:#fff;font-size:.95rem;pointer-events:none;padding:0 20px}
</style>
</head>
<body>
<header>
  <h1>👁️ Eye Piano</h1>
  <p class="sub">Look at a key and hold your gaze to play it.</p>
</header>
<div class="bar">
  <button id="eye">Start eye tracking</button>
  <button id="head">Use head tracking</button>
  <button id="finger">Use finger tracking</button>
  <button id="mouse" class="alt">Use mouse / touch</button>
  <button id="recenter" class="alt" style="display:none">Recenter</button>
</div>
<div id="status">Choose a mode to begin.</div>
<div id="piano"></div>
<div id="dot"></div>
<div id="cal"><div class="msg">Look at each dot and click it 3 times. Keep your head fairly still.</div></div>

<script>
const WHITE=[["C",261.63],["D",293.66],["E",329.63],["F",349.23],["G",392],["A",440],["B",493.88],["C",523.25]];
const BLACK=[[0,"C#",277.18],[1,"D#",311.13],[3,"F#",369.99],[4,"G#",415.3],[5,"A#",466.16]];
const DWELL=650;
const piano=document.getElementById("piano"),dot=document.getElementById("dot"),statusEl=document.getElementById("status");
let ctx=null,mode=null,gx=-100,gy=-100,cur=null,since=0;

WHITE.forEach(([n,f])=>{const k=document.createElement("div");k.className="key";k.dataset.f=f;k.textContent=n;piano.appendChild(k)});


function play(f,el){
  if(!ctx)return;
  const t=ctx.currentTime,o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
  o.type="triangle";o2.type="sine";o.frequency.value=f;o2.frequency.value=f*2;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+1.6);
  o.connect(g);o2.connect(g);g.connect(ctx.destination);o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.7);
  el.classList.add("on");setTimeout(()=>el.classList.remove("on"),180);
}
function setStatus(s){statusEl.textContent=s}
function startAudio(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume()}

function setGaze(x,y){
  gx=gx<0?x:gx+(x-gx)*.25; gy=gy<0?y:gy+(y-gy)*.25; // smoothing
  dot.style.display="block";dot.style.left=gx+"px";dot.style.top=gy+"px";
}

function tick(now){
  let el=null;
  if(mode){dot.style.pointerEvents="none";const e=document.elementFromPoint(gx,gy);el=e&&e.closest&&e.closest(".key")}
  if(el!==cur){if(cur)cur.style.setProperty("--p",0);cur=el;since=now}
  if(cur){
    const p=Math.min(1,(now-since)/DWELL);cur.style.setProperty("--p",p);
    if(p>=1){play(+cur.dataset.f,cur);since=now+250;cur.style.setProperty("--p",0)} // brief pause before repeat
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

document.getElementById("mouse").onclick=()=>{
  startAudio();mode="mouse";setStatus("Mouse mode: hover (or drag a finger) over a key and hold.");
  const mv=e=>{const t=e.touches?e.touches[0]:e;setGaze(t.clientX,t.clientY)};
  addEventListener("pointermove",mv);addEventListener("touchmove",mv,{passive:true});
};

document.getElementById("eye").onclick=async()=>{
  startAudio();setStatus("Loading eye tracker… allow camera access.");
  try{
    await new Promise((res,rej)=>{const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/webgazer/dist/webgazer.min.js";s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)});
    webgazer.setGazeListener(d=>{if(d)setGaze(d.x,d.y)});
    await webgazer.begin();
    try{webgazer.showPredictionPoints(false)}catch(e){}
    mode="eye";setStatus("Calibrating…");calibrate();
  }catch(err){
    setStatus("Couldn't start eye tracking here (camera or library blocked). Try mouse mode, or open this page in a regular browser tab.");
  }
};

// ---- Head tracking: nose position from WebGazer's face landmarks ----
const GAIN=3.2; // head shift of ~±15% of the camera frame spans the whole piano
let neutral=null,buf=[],misses=0,headOn=false;
function noseX(){
  try{
    const p=webgazer.getTracker().getPositions();
    if(!p||!p[1])return null;
    const v=document.getElementById("webgazerVideoFeed");
    return 1-p[1][0]/((v&&v.videoWidth)||320); // mirrored so right = right
  }catch(e){return null}
}
function recenter(){
  if(mode==="finger"){retakeBg();return}
  neutral=null;buf=[];setStatus("Hold still, facing the screen…");
}

// ---- Finger tracking: model-free, finds the topmost fingertip against a captured background ----
const FW=80,FH=60;
let fv=null,fx=null,bg=null,bgN=0,warm=0,fingerOn=false;
function retakeBg(){bg=new Float32Array(FW*FH*3);bgN=0;warm=0;gx=-100;dot.style.display="none";
  setStatus("Keep your hand out of view and hold still… capturing background.")}
function fingerLoop(){
  if(!fingerOn)return;
  if(fv.readyState>=2){
    fx.drawImage(fv,0,0,FW,FH);
    const d=fx.getImageData(0,0,FW,FH).data;
    if(bgN<20){
      if(++warm>30){
        for(let i=0,j=0;i<d.length;i+=4,j+=3){bg[j]+=d[i]/20;bg[j+1]+=d[i+1]/20;bg[j+2]+=d[i+2]/20}
        if(++bgN===20)setStatus("Point one finger up and move it left/right. Hold over a key to play.");
      }
    }else{
      const cnt=new Array(FH).fill(0),sum=new Array(FH).fill(0);
      for(let y=0;y<FH;y++)for(let x=0;x<FW;x++){
        const k=(y*FW+x)*4,j=(y*FW+x)*3;
        if(Math.abs(d[k]-bg[j])+Math.abs(d[k+1]-bg[j+1])+Math.abs(d[k+2]-bg[j+2])>110){cnt[y]++;sum[y]+=x}
      }
      let tip=null;
      for(let y=0;y<FH-3;y++){
        if(cnt[y]>=3&&cnt[y+1]>=3&&cnt[y+2]>=3){tip=(sum[y]+sum[y+1]+sum[y+2])/(cnt[y]+cnt[y+1]+cnt[y+2]);break}
      }
      if(tip===null){gx=-100;dot.style.display="none"}
      else{const r=piano.getBoundingClientRect();
        setGaze(Math.max(2,Math.min(innerWidth-2,(1-tip/FW)*innerWidth)),r.top+r.height/2)}
    }
  }
  requestAnimationFrame(fingerLoop);
}
document.getElementById("finger").onclick=async()=>{
  startAudio();setStatus("Allow camera access…");
  try{
    headOn=false;
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:320,height:240}});
    fv=document.createElement("video");fv.muted=true;fv.playsInline=true;fv.srcObject=stream;
    fv.style.cssText="position:fixed;right:8px;bottom:8px;width:110px;border-radius:8px;transform:scaleX(-1);z-index:30;opacity:.8";
    document.body.appendChild(fv);await fv.play();
    const c=document.createElement("canvas");c.width=FW;c.height=FH;fx=c.getContext("2d",{willReadFrequently:true});
    mode="finger";fingerOn=true;retakeBg();
    document.getElementById("recenter").style.display="";
    requestAnimationFrame(fingerLoop);
  }catch(err){
    setStatus("Couldn't access the camera here. Try opening the page in a regular browser tab.");
  }
};
function headLoop(){
  if(!headOn)return;
  const x=noseX();
  if(x===null){if(++misses===240)setStatus("No face detected. Check lighting, or try mouse mode.")}
  else{
    misses=0;
    if(neutral===null){
      buf.push(x);
      if(buf.length>=30){neutral=buf.reduce((a,b)=>a+b)/buf.length;setStatus("Head mode: turn or lean left/right to move. Hold on a key to play.")}
    }else{
      const r=piano.getBoundingClientRect();
      const sx=innerWidth/2+(x-neutral)*GAIN*innerWidth;
      setGaze(Math.max(2,Math.min(innerWidth-2,sx)),r.top+r.height/2);
    }
  }
  requestAnimationFrame(headLoop);
}
document.getElementById("recenter").onclick=recenter;
document.getElementById("head").onclick=async()=>{
  startAudio();setStatus("Loading face tracker… allow camera access.");
  try{
    await new Promise((res,rej)=>{const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/npm/webgazer/dist/webgazer.min.js";s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)});
    await webgazer.begin();
    try{webgazer.showPredictionPoints(false)}catch(e){}
    mode="head";headOn=true;recenter();
    document.getElementById("recenter").style.display="";
    requestAnimationFrame(headLoop);
  }catch(err){
    setStatus("Couldn't start head tracking here (camera or library blocked). Try mouse mode, or open this page in a regular browser tab.");
  }
};

function calibrate(){
  const cal=document.getElementById("cal");cal.style.display="block";
  const pts=[[10,12],[50,12],[90,12],[10,50],[50,50],[90,50],[10,88],[50,88],[90,88]];let left=pts.length;
  pts.forEach(([x,y])=>{const b=document.createElement("button");b.className="pt";b.style.left=x+"%";b.style.top=y+"%";
    let c=0;b.onclick=()=>{c++;b.style.opacity=1-c/3*.8;if(c>=3){b.remove();if(--left===0){cal.style.display="none";setStatus("Ready — look at a key and hold.")}}};
    cal.appendChild(b)});
}
</script>
</body>
</html>
